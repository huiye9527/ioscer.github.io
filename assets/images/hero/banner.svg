<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1200" viewBox="0 0 1920 1200" role="img" aria-label="iOSCER certificate visual">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a3140"/>
      <stop offset="42%" stop-color="#12151d"/>
      <stop offset="100%" stop-color="#0a84ff" stop-opacity="0.42"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f8fa"/>
      <stop offset="100%" stop-color="#e8ebf0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="36" flood-color="#05070c" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1920" height="1200" fill="url(#bg)"/>
  <circle cx="1460" cy="220" r="280" fill="#0a84ff" opacity="0.34" filter="url(#soft)"/>
  <circle cx="1680" cy="760" r="320" fill="#8eb8ff" opacity="0.18" filter="url(#soft)"/>
  <circle cx="320" cy="980" r="260" fill="#0a84ff" opacity="0.12" filter="url(#soft)"/>

  <g filter="url(#cardShadow)">
    <rect x="280" y="160" width="620" height="720" rx="56" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.26" stroke-width="2"/>
  </g>
  <rect x="330" y="230" width="520" height="64" rx="18" fill="#ffffff" fill-opacity="0.1"/>
  <rect x="330" y="330" width="360" height="24" rx="12" fill="#ffffff" fill-opacity="0.16"/>
  <rect x="330" y="376" width="420" height="18" rx="9" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="330" y="416" width="280" height="18" rx="9" fill="#ffffff" fill-opacity="0.08"/>
  <rect x="330" y="520" width="520" height="220" rx="34" fill="#0a84ff" fill-opacity="0.26" stroke="#9dceff" stroke-opacity="0.35"/>
  <text x="380" y="620" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="54" font-weight="700">iOSCER</text>
  <text x="380" y="678" fill="#cfe4ff" font-family="Segoe UI, Arial, sans-serif" font-size="26">Apple Certificate</text>

  <g filter="url(#cardShadow)">
    <rect x="980" y="240" width="520" height="580" rx="64" fill="url(#panel)"/>
  </g>
  <rect x="1030" y="310" width="420" height="28" rx="14" fill="#0b0d12" opacity="0.12"/>
  <rect x="1030" y="368" width="300" height="18" rx="9" fill="#0b0d12" opacity="0.08"/>
  <rect x="1030" y="430" width="420" height="150" rx="28" fill="#0a84ff" opacity="0.14"/>
  <rect x="1030" y="620" width="190" height="54" rx="27" fill="#0a84ff"/>
  <rect x="1240" y="620" width="190" height="54" rx="27" fill="#0b0d12" opacity="0.08"/>
</svg>
